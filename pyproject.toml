[project]
name = "a2a-two-agents"
version = "0.1.0"
description = "Two A2A agents that discover each other and talk over the Agent2Agent protocol"
readme = "README-a2a.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.2",
    "anthropic>=1.5.0",
    "cursor-sdk>=1.0.31",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]
